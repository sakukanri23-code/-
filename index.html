<body>
    <button id="locateBtn" style="position: absolute; top: 10px; right: 10px; z-index: 1000; padding: 10px; background: white; border: 1px solid #ccc; border-radius: 5px;">現在地を表示</button>
    <div id="map"></div>

    <script>
        const map = L.map('map').setView([35.6329, 139.8804], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        let userMarker;

        // ボタンを押した時に位置情報をリクエストする
        document.getElementById('locateBtn').addEventListener('click', function() {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const latlng = [position.coords.latitude, position.coords.longitude];
                    if (!userMarker) {
                        userMarker = L.circleMarker(latlng, { radius: 10, color: 'white', fillColor: '#007bff', fillOpacity: 1 }).addTo(map);
                    } else {
                        userMarker.setLatLng(latlng);
                    }
                    map.setView(latlng, 17);
                },
                (error) => {
                    alert("位置情報の取得を許可してください（設定を確認してください）");
                },
                { enableHighAccuracy: true }
            );
        });
    </script>
</body>
